}/* 2. كود الـ Scrollbar (زيدي هاد الجزء هنا) */
::-webkit-scrollbar {
    width: 10px;
}

::-webkit-scrollbar-track {
    background: #FDF5F8; /* استعملت اللون الكريمي مباشرة */
}

::-webkit-scrollbar-thumb {
    background: #F5D6E6; /* لون الـ sage-light الوردي */
    border-radius: 10px;
    border: 2px solid #FDF5F8;
}

::-webkit-scrollbar-thumb:hover {
    background: #C0729A; /* لون الـ sage الوردي ملي كنقيسوه */
}
     *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
 .share-container {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin: 15px 0;
    padding: 5px;
}
.recipe-author-meta {
    display: flex;
    gap: 12px;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 1rem;
    align-items: center;
}
.recipe-author-name {
    font-weight: 500;
    color: var(--sage-dark);
}

:root{--cream:#FDF5F8;--warm-white:#FFF8FB;--card-bg:#FFF8FB;--sage:#C0729A;--sage-light:#F5D6E6;--sage-dark:#A0446F;--gold:#4A7FB5;--gold-light:#C8DDEF;--charcoal:#2C2035;--muted:#7A6878;--border:rgba(44,32,53,0.10);--header-bg:#FFF8FB;--body-bg:#FDF5F8;--toggle-bg:#EDD6E5;}
[data-theme="dark"]{--cream:#1A1520;--warm-white:#221828;--card-bg:#221828;--sage:#C0729A;--sage-light:#4A1F35;--sage-dark:#E090B8;--gold:#6A9FD5;--gold-light:#1A3550;--charcoal:#F5EEF8;--muted:#B09AB8;--border:rgba(245,238,248,0.10);--header-bg:#160F1C;--body-bg:#1A1520;--toggle-bg:#3A2545;}
html{scroll-behavior:smooth}
body{font-family:'Jost',sans-serif;background:var(--body-bg);color:var(--charcoal);min-height:100vh;transition:background .3s,color .3s}
/* HEADER */
header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 1rem; /* نقصنا شوية من الجناب */
    position: sticky;
    top: 0;
    z-index: 200;
    transition: background .3s;
    width: 100%; /* ضروري باش يعرف قياس الشاشة */
    box-sizing: border-box; /* باش الـ padding ما يخرجش الهيدر لبرة */
}

nav {
    max-width: 100%; /* بدلي 1400px لـ 100% في الموبايل */
    margin: 0 auto;
    display: flex;
    align-items: center;
    height: 62px;
    justify-content: space-between;
}.logo-wrap{display:flex;align-items:center;gap:8px;text-decoration:none;flex-shrink:0;margin-right:.5rem}
.logo-img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
.logo-text{font-family:'Cormorant Garamond',serif;font-size:1.25rem;font-weight:600;background:linear-gradient(90deg,#A0446F,#4A7FB5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}

.nav-links{display:flex;gap:0;list-style:none;flex:1;justify-content:center;flex-wrap:nowrap}
.nav-links li a{font-size:.68rem;font-weight:400;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:.32rem .55rem;border-radius:6px;white-space:nowrap;display:block;transition:color .2s,background .2s}
.nav-links li a:hover,.nav-links li a.active-nav{color:var(--sage-dark);background:var(--sage-light)}

.header-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    margin-left: auto;
}

.lang-switcher{display:flex;align-items:center;gap:2px;background:var(--toggle-bg);border-radius:50px;padding:3px;flex-shrink:0}
.lang-btn{font-size:.66rem;font-weight:500;padding:.22rem .55rem;border-radius:50px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:'Jost',sans-serif;transition:background .2s,color .2s}
.lang-btn.active{background:var(--card-bg);color:var(--charcoal);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.dark-btn{background:none;border:none;cursor:pointer;font-size:.85rem;line-height:1;padding:.2rem;flex-shrink:0}
.toggle{width:36px;height:20px;background:var(--toggle-bg);border-radius:50px;border:1px solid var(--border);cursor:pointer;position:relative;transition:background .3s;flex-shrink:0}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--sage);transition:transform .3s}
[data-theme="dark"] .toggle::after{transform:translateX(16px)}

/* الـ Hamburger كيكون مخفي في الشاشة الكبيرة */
.hamburger{display:none;flex-direction:column;gap:4px;cursor:pointer;background:none;border:none;padding:5px;border-radius:6px;flex-shrink:0}
.hamburger span{display:block;width:20px;height:2px;background:var(--charcoal);border-radius:2px;transition:all .25s}
.hamburger.open span:nth-child(1){transform:rotate(45deg) translate(4px,4px)}
.hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(4px,-4px)}

.mobile-menu{display:none;flex-direction:column;background:var(--header-bg);border-top:1px solid var(--border);padding:.4rem 1.2rem .8rem;transition:background .3s}
.mobile-menu.open{display:flex}
.mobile-menu a {
    font-size: .8rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    padding: .65rem 0;
    border-bottom: 1px solid var(--border);
    transition: color .2s;
    text-align: right; 
}
.mobile-menu a:last-child{border-bottom:none}
.mobile-menu a:hover{color:var(--charcoal)}

/* الترتيب ديال الموبايل */
@media(max-width:960px) {
    /* 1. تصغير اللوغو باش نخليو البلاصة */
    .logo-text {
        font-size: 1rem !important; /* نقصناه من 1.25 لـ 1.0 */
    }
    .logo-img {
        width: 30px !important; /* صغرنا الصورة شوية */
        height: 30px !important;
    }

    /* 2. إخفاء الروابط القديمة */
    .nav-links { display: none !important; }

    /* 3. جمع اللغات والمنيو في اليمين بلا زحام */
    .header-right {
        display: flex !important;
        align-items: center;
        gap: 5px; /* مسافة صغيرة بزاف */
        margin-left: auto;
        padding-right: 10px; /* باش ما يخرجش المنيو لبرة */
    }

    /* 4. إظهار اللغات والمنيو */
    .lang-switcher { 
        display: flex !important; 
        transform: scale(0.8); /* تصغير أزرار اللغات */
    }

    .hamburger { 
        display: flex !important; 
        margin-left: 2px;
    }
}

/* GENERAL */
.page-wrap{max-width:1100px;margin:0 auto;padding:2.5rem 2rem 5rem}
.breadcrumb{font-size:.75rem;color:var(--muted);margin-bottom:1.5rem}
.breadcrumb a{color:var(--sage-dark);text-decoration:none}
.page-header{margin-bottom:2.5rem;padding-bottom:1.2rem;border-bottom:1px solid var(--border)}
.page-eyebrow{font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:.4rem}
.page-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,5vw,3rem);font-weight:300;color:var(--charcoal)}
.page-title em{font-style:italic;color:var(--sage-dark)}
.section-title{font-family:'Cormorant Garamond',serif;font-size:1.65rem;font-weight:400;color:var(--charcoal)}
.section-eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:.3rem}
.see-all{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sage-dark);text-decoration:none;font-weight:500}

/* ARTICLES GRID */
.articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1.3rem}
.article-card{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s,background .3s;text-decoration:none;color:inherit;display:block}
.article-card:hover{transform:translateY(-3px);border-color:var(--sage)}
.art-img{height:175px;display:flex;align-items:center;justify-content:center;font-size:3.5rem;overflow:hidden;background:var(--sage-light)}
.art-img img{width:100%;height:100%;object-fit:cover}
.art-body{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.3rem}
.art-cat{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sage-dark);font-weight:500}
.art-title{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:var(--charcoal);line-height:1.3;flex:1}
.art-lire{font-size:.72rem;color:var(--sage-dark);font-weight:500;margin-top:.4rem;padding-top:.55rem;border-top:1px solid var(--border)}
.art-coming{opacity:.35;cursor:default;pointer-events:none}
.featured-article{grid-row:1/3;grid-column:1}
.featured-article .art-img{height:250px}
.featured-article .art-title{font-size:1.4rem}
.empty-state{text-align:center;padding:4rem 2rem;color:var(--muted);font-size:.9rem;grid-column:1/-1}
.empty-state .empty-icon{font-size:3rem;margin-bottom:1rem;display:block}

/* AD */
.ad-banner-wrap{max-width:1100px;margin:2rem auto 0;padding:0 2rem}
.ad-zone{background:var(--card-bg);border:1px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;height:90px;width:100%;transition:background .3s}

/* CATEGORIES */
.categories{max-width:1100px;margin:3rem auto;padding:0 2rem}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-top:1.2rem}
.cat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s,transform .2s,background .3s;text-decoration:none;color:inherit;display:block}
.cat-card:hover{border-color:var(--sage);transform:translateY(-2px)}
.cat-icon{font-size:1.9rem;margin-bottom:.45rem;display:block}
.cat-name{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* HERO */
.hero{background:var(--warm-white);padding:4rem 2rem 3.5rem;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden;transition:background .3s}
.hero::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:500px;height:500px;background:radial-gradient(circle,#F5D6E6 0%,#C8DDEF 55%,transparent 75%);opacity:.3;pointer-events:none}
.hero-eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:1rem;display:flex;align-items:center;justify-content:center;gap:10px}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';width:28px;height:1px;background:var(--sage);opacity:.5}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2.4rem,6vw,4.2rem);font-weight:300;line-height:1.1;color:var(--charcoal);margin-bottom:1rem}
.hero h1 em{font-style:italic;color:var(--sage-dark)}
.hero>p{font-size:.93rem;color:var(--muted);max-width:460px;margin:0 auto 2rem;line-height:1.7}
.search-wrap{max-width:390px;margin:0 auto;position:relative}
.search-wrap input{width:100%;padding:.78rem 1.2rem .78rem 2.8rem;border:1px solid var(--border);border-radius:50px;background:var(--body-bg);font-family:'Jost',sans-serif;font-size:.87rem;color:var(--charcoal);outline:none;transition:border-color .2s,background .3s}
.search-wrap input:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(192,114,154,.12)}
.search-wrap input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);color:var(--muted)}

/* NEWSLETTER */
.newsletter{background:var(--sage-dark);padding:3.5rem 2rem;text-align:center;margin-top:3rem}
.newsletter h2{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:300;color:white;margin-bottom:.5rem}
.newsletter p{font-size:.85rem;color:rgba(255,255,255,.65);margin-bottom:1.3rem}
.nl-form{display:flex;gap:.7rem;max-width:380px;margin:0 auto}
.nl-form input{flex:1;padding:.7rem 1.1rem;border:1px solid rgba(255,255,255,.25);border-radius:50px;background:rgba(255,255,255,.1);color:white;font-family:'Jost',sans-serif;font-size:.82rem;outline:none}
.nl-form input::placeholder{color:rgba(255,255,255,.5)}
.nl-form button{padding:.7rem 1.3rem;background:var(--gold);color:white;border:none;border-radius:50px;font-family:'Jost',sans-serif;font-size:.78rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.nl-form button:hover{opacity:.85}

/* RECIPE PAGE */
.recipe-wrap{max-width:880px;margin:0 auto;padding:2rem 2rem 5rem}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;border:none;background:none;font-family:'Jost',sans-serif;padding:0;margin-bottom:2rem;transition:color .2s;text-decoration:none}
.back-btn:hover{color:var(--charcoal)}
.recipe-hero{display:grid;grid-template-columns:1fr 1fr;gap:2.5rem;margin-bottom:2.5rem;align-items:center}
.recipe-hero-img{border-radius:18px;overflow:hidden;border:1px solid var(--border);aspect-ratio:1;background:var(--sage-light);display:flex;align-items:center;justify-content:center;font-size:5rem}
.recipe-hero-img img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;background:var(--sage-light);color:var(--sage-dark);padding:.26rem .75rem;border-radius:50px;margin-bottom:.75rem;font-weight:500}
.recipe-hero-info h1{font-family:'Cormorant Garamond',serif;font-size:2.1rem;font-weight:400;line-height:1.15;color:var(--charcoal);margin-bottom:.8rem}
.recipe-hero-info>p{font-size:.87rem;color:var(--muted);line-height:1.7;margin-bottom:1.3rem}
.recipe-stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card-bg);border:1px solid var(--border);border-radius:13px;padding:.9rem;transition:background .3s}
.stat{text-align:center;padding:.35rem 0}
.stat+.stat{border-left:1px solid var(--border)}
.stat-val{display:block;font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--charcoal);line-height:1.2}
.stat-label{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.recipe-body{display:grid;grid-template-columns:240px 1fr;gap:2.5rem;margin-top:2.5rem}
.ingredients-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:15px;padding:1.3rem;height:fit-content;position:sticky;top:78px;transition:background .3s}
.panel-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--charcoal);margin-bottom:.8rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.ingredient-list{list-style:none}
.ingredient-item{display:flex;align-items:flex-start;padding:.42rem 0;border-bottom:1px solid var(--border);gap:.4rem;font-size:.82rem;color:var(--charcoal)}
.ingredient-item:last-child{border-bottom:none}
.ingredient-item::before{content:'•';color:var(--sage);flex-shrink:0}
.steps-title{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:400;color:var(--charcoal);margin-bottom:1.2rem;padding-bottom:.6rem;border-bottom:1px solid var(--border)}
.step{display:flex;gap:1rem;margin-bottom:1.5rem}
.step-num{width:27px;height:27px;border-radius:50%;background:var(--sage);color:white;font-size:.75rem;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:.1rem}
.step-text{font-size:.85rem;color:var(--muted);line-height:1.75;padding-top:.05rem}
.tips-section{margin-top:1.8rem;padding:1.3rem;background:var(--card-bg);border:1px solid var(--border);border-radius:13px;transition:background .3s}
.tips-section h3{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;color:var(--charcoal);margin-bottom:.8rem}
.tips-section ul{list-style:none}
.tips-section li{font-size:.82rem;color:var(--muted);padding:.35rem 0 .35rem 1rem;position:relative;line-height:1.6}
.tips-section li::before{content:'✦';position:absolute;left:0;color:var(--gold);font-size:.55rem;top:.5rem}

/* ABOUT */
.about-wrap{max-width:860px;margin:0 auto;padding:2rem 2rem 5rem}
.about-hero{display:grid;grid-template-columns:1fr 1.6fr;gap:3rem;align-items:center;margin-bottom:3rem;padding-bottom:3rem;border-bottom:1px solid var(--border)}
.about-img{width:100%;aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--sage-light),var(--gold-light));display:flex;align-items:center;justify-content:center;font-size:5rem;border:3px solid var(--border);position:relative}
.about-img-badge{position:absolute;bottom:8px;right:8px;background:var(--sage-dark);color:white;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.32rem .7rem;border-radius:50px;font-weight:500}
.about-intro h1{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:300;line-height:1.15;color:var(--charcoal);margin-bottom:.9rem}
.about-intro h1 em{font-style:italic;color:var(--sage-dark)}
.about-intro>p{font-size:.88rem;color:var(--muted);line-height:1.8;margin-bottom:.8rem}
.about-stats{display:flex;gap:2rem;margin-top:1.2rem}
.about-stat-num{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:400;color:var(--sage-dark);line-height:1}
.about-stat-label{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.about-section{margin-bottom:2.5rem}
.about-section-title{font-family:'Cormorant Garamond',serif;font-size:1.65rem;font-weight:400;color:var(--charcoal);margin-bottom:.9rem;padding-bottom:.55rem;border-bottom:1px solid var(--border)}
.about-section p{font-size:.88rem;color:var(--muted);line-height:1.85;margin-bottom:.8rem}
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.2rem}
.value-card{background:var(--card-bg);border:1px solid var(--border);border-radius:13px;padding:1.3rem 1rem;text-align:center;transition:background .3s}
.value-icon{font-size:1.8rem;margin-bottom:.5rem;display:block}
.value-title{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:400;color:var(--charcoal);margin-bottom:.3rem}
.value-desc{font-size:.75rem;color:var(--muted);line-height:1.5}
.contact-box{background:var(--card-bg);border:1px solid var(--border);border-radius:15px;padding:1.8rem;text-align:center;transition:background .3s}
.contact-box h3{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:400;color:var(--charcoal);margin-bottom:.4rem}
.contact-box p{font-size:.85rem;color:var(--muted);margin-bottom:1.2rem}
.contact-link{display:inline-flex;align-items:center;gap:.5rem;padding:.6rem 1.3rem;border:1px solid var(--border);border-radius:50px;font-size:.8rem;color:var(--charcoal);text-decoration:none;background:var(--body-bg);transition:border-color .2s,background .2s}
.contact-link:hover{border-color:var(--sage);background:var(--sage-light);color:var(--sage-dark)}
/* FOOTER - النسخة المتوافقة مع الـ Dark Mode */
footer {
    background: var(--body-bg); /* غيتبع لون الموقع (أبيض في العادي، غامق في الدارك) */
    padding: 2.5rem 2rem 1.5rem;
    margin-top: auto;
    border-top: 1px solid var(--border);
    transition: background .3s, border-color .3s;
}

.footer-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr;
    gap: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
}

.footer-brand-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    color: var(--charcoal); /* اللون الأساسي للنصوص عندك */
    display: block;
    margin-bottom: .4rem;
}

.footer-brand p {
    font-size: .78rem;
    color: var(--muted); /* اللون الباهت للنصوص */
    line-height: 1.6;
}

.footer-col h4 {
    font-size: .65rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .8rem;
}

.footer-col ul {
    list-style: none;
    padding: 0;
}

.footer-col li {
    margin-bottom: .4rem;
}

.footer-col a {
    font-size: .8rem;
    color: var(--muted);
    text-decoration: none;
    transition: color .2s;
}

.footer-col a:hover {
    color: var(--sage-dark); /* لون الهوية عند التمرير */
}

.footer-bottom {
    max-width: 1100px;
    margin: 1.2rem auto 0;
    display: flex;
    justify-content: space-between;
    font-size: .7rem;
    color: var(--muted);
}

/* تعديل للموبايل باش يجي مقاد */
@media (max-width: 768px) {
    .footer-inner {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        text-align: center;
    }
    .footer-bottom {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }
}
/* RESPONSIVE */
@media(max-width:800px){
  .recipe-hero{grid-template-columns:1fr}
  .recipe-body{grid-template-columns:1fr}
  .ingredients-panel{position:static}
  .recipe-stats{grid-template-columns:repeat(2,1fr)}
  .about-hero{grid-template-columns:1fr}
  .values-grid{grid-template-columns:1fr 1fr}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .footer-inner{grid-template-columns:1fr}
  .footer-bottom{flex-direction:column;gap:.4rem;text-align:center}
  .nl-form{flex-direction:column}
  .articles-grid{grid-template-columns:1fr 1fr}
  .featured-article{grid-row:auto;grid-column:1/3}
}
@media(max-width:500px){
  .articles-grid{grid-template-columns:1fr}
  .featured-article{grid-column:1}
  .cat-grid{grid-template-columns:repeat(2,1fr)}
}
    /* BACK TO TOP BUTTON STYLE */
#backToTop {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--sage);
    color: white;
    border: 1px solid var(--border);
    width: 45px;
    height: 45px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    z-index: 999;
    /* هادي هي اللي غاتخليه مخفي ف الأول */
    display: none; 
    align-items: center;
    justify-content: center;
    transition: background 0.3s, transform 0.3s;
}

#backToTop:hover {
    background: var(--sage-dark);
    transform: translateX(-50%) translateY(-3px);
}

[data-theme="dark"] #backToTop {
    background: var(--sage-light);
    color: var(--body-bg);
}
[data-theme="dark"] #backToTop:hover {
    background: var(--sage);
}
</style>
<body>

  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var params = new URLSearchParams(window.location.search);
      var cat = params.get('cat');
      var id = params.get('id');

      if (!cat || !id) return;

      // جلب البيانات من JSON ومن الـ LocalStorage للتأكد
      fetch('articles.json?v=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          // 1. بحث في JSON
          var recipe = (data[cat] || []).find(function(r) { return r.id === id; });
          
          // 2. إذا لم يوجد، بحث في LocalStorage
          if (!recipe) {
            var stored = localStorage.getItem('lb_articles_' + cat);
            var adminArticles = stored ? JSON.parse(stored) : [];
            recipe = adminArticles.find(function(r) { return r.id === id; });
          }

          if (recipe) {
            _recipeData = recipe;
            renderRecipe(recipe);

            // ---------------------------------------------------
            // 👇 كود الـ Rich Pins المطور تلقائياً من الـ JSON 👇
            // ---------------------------------------------------
            try {
              var recipeSchema = {
                  "@context": "https://schema.org/",
                  "@type": "Recipe",
                  "name": recipe.title || recipe.name, 
                  "image": [window.location.origin + (recipe.img || recipe.image)], 
                  "author": {
                      "@type": "Organization",
                      "name": "Lotus Blanc"
                  },
                  "description": recipe.description || "وصفة شهية من موقع لوتس بلان",
                  "recipeIngredient": recipe.ingredients || [], 
                  "recipeInstructions": (recipe.steps || recipe.instructions || []).map(function(step) {
                      return {
                          "@type": "HowToStep",
                          "text": typeof step === 'string' ? step : (step.text || "")
                      };
                  })
              };

              // مسح السكريبت القديم إذا كان موجوداً
              var oldScript = document.getElementById('dynamic-recipe-schema');
              if (oldScript) oldScript.remove();

              // حقن السكريبت الجديد في الـ head
              var script = document.createElement('script');
              script.id = 'dynamic-recipe-schema';
              script.type = 'application/ld+json';
              script.text = JSON.stringify(recipeSchema);
              document.head.appendChild(script);
            } catch (e) {
              console.log("Erreur Schema:", e); 
            }
            // ---------------------------------------------------

          } else {
            document.getElementById('recipe-content').innerHTML = "<h2 style='text-align:center;padding:5rem;'>Recette non trouvée.</h2>";
          }
        });
    });
  </script>

  <div id="recipe-content">
    </div>

</body></html>
